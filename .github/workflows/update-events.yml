name: Check for event updates

# Reads new articles and changed organizer pages listed in sources/sources.json, asks Claude
# what they change in data/events.json, and opens a pull request with the changes for review.
# Merging the pull request deploys the site. Signs in to the Claude API with the job's GitHub
# identity (Workload Identity Federation), so no API key is stored: the ANTHROPIC_* repository
# variables name the federation rule, organization and service account. See README.
on:
  schedule:
    # Daily, away from the top of the hour when GitHub schedules are busiest.
    - cron: "41 14 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Read just this page (optional), e.g. a new announcement"
        required: false

concurrency:
  group: update-events
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write  # lets the job sign in to the Claude API as itself

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read new announcements
        id: update
        run: node scripts/update-events.mjs
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ONLY_URL: ${{ inputs.url }}

      - name: Test the updated schedule
        if: steps.update.outputs.events_changed == 'true'
        run: npm test

      # The list of what was read goes straight to main on every run, never into a pull
      # request, so open update PRs can't conflict over it.
      - name: Save what was read
        if: steps.update.outputs.seen_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/seen.json
          git diff --cached --quiet || { git commit -m "Record sources read by the event update check"; git push; }

      # Each run with changes opens its own pull request, holding only data/events.json.
      - name: Open a pull request
        if: steps.update.outputs.events_changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/event-updates-${{ github.run_number }}
          delete-branch: true
          title: "Event updates (${{ github.run_number }})"
          body-path: .update-summary.md
          commit-message: "Update events from new announcements"
          add-paths: |
            data/events.json
