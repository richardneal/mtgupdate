name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so the link-preview image (what's live and next) keeps up with the schedule.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node scripts/build.mjs --check

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the 'last updated' date comes from git history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Skip when no Cloudflare token is set
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret not set; skipping deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/build.mjs
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: node hosting/build.mjs
      - name: Render the link-preview image
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/og-image.mjs
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --config hosting/wrangler.jsonc
